apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-18-odoo
  namespace: odoo-18
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - apps
