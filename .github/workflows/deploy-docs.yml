name: 📚 Deploy K3s-Odoo Documentation (Advanced)

on:
  push:
    branches: [ main ]
    paths: [ '**.md', 'assets/**', 'docs/**', 'index.html', 'style.css' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: 📁 Checkout
      uses: actions/checkout@v4

    - name: 🔍 Pre-build Validation
      run: |
        echo "🔍 Validating project structure..."
        
        # Проверки за важни файлове
        [ -f "index.html" ] && echo "✅ index.html found" || echo "❌ index.html missing!"
        [ -f "style.css" ] && echo "✅ style.css found" || echo "⚠️ style.css missing"
        [ -d "docs" ] && echo "✅ docs/ folder found" || echo "ℹ️ docs/ folder not found"
        [ -d "assets" ] && echo "✅ assets/ folder found" || echo "ℹ️ assets/ folder not found"
        
        # Брой markdown файлове
        md_count=$(find . -name "*.md" -not -path "./.git/*" | wc -l)
        echo "📝 Found $md_count markdown files"

    - name: 📝 Build Static Site
      run: |
        # Създай основна структура
        mkdir -p _site/{assets,docs}
        
        # Копирай основни файлове
        cp index.html _site/
        
        # Копирай CSS и JS файлове
        [ -f "style.css" ] && cp style.css _site/
        [ -d "assets" ] && cp -r assets/* _site/assets/ 2>/dev/null || true
        
        # Копирай документационни папки
        for dir in docs scripts common vm barebone odoo-18; do
          if [ -d "$dir" ]; then
            cp -r "$dir" _site/
            echo "✅ Copied $dir/"
          fi
        done
        
        # Копирай markdown файлове в root
        find . -maxdepth 1 -name "*.md" -exec cp {} _site/ \;
        
        # Създай navigation файл за JS
        cat > _site/assets/navigation.json << EOF
        {
          "pages": [
            {"title": "Начало", "url": "/", "icon": "fas fa-home"},
            {"title": "Odoo 18 Enterprise", "url": "/docs/README-k3s-odoo-18.md", "icon": "fab fa-docker"},
            {"title": "VM Deployment", "url": "/docs/README-VM.md", "icon": "fas fa-desktop"},
            {"title": "Bare Metal", "url": "/docs/README-BAREBONE.md", "icon": "fas fa-server"},
            {"title": "Migration Guide", "url": "/docs/MIGRATION-GUIDE.md", "icon": "fas fa-exchange-alt"}
          ]
        }
        EOF

    - name: 🌍 Setup Domain & Meta
      run: |
        # Custom domain
        echo "docs.odoo-shell.dev" > _site/CNAME
        
        # Disable Jekyll
        touch _site/.nojekyll
        
        # Create robots.txt
        cat > _site/robots.txt << EOF
        User-agent: *
        Allow: /
        
        Sitemap: https://docs.odoo-shell.dev/sitemap.xml
        EOF
        
        # Create basic sitemap
        cat > _site/sitemap.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          <url><loc>https://docs.odoo-shell.dev/</loc><priority>1.0</priority></url>
          <url><loc>https://docs.odoo-shell.dev/docs/README-k3s-odoo-18.md</loc><priority>0.9</priority></url>
          <url><loc>https://docs.odoo-shell.dev/docs/README-VM.md</loc><priority>0.8</priority></url>
          <url><loc>https://docs.odoo-shell.dev/docs/README-BAREBONE.md</loc><priority>0.8</priority></url>
        </urlset>
        EOF

    - name: ✅ Final Verification
      run: |
        echo "📊 Final Build Statistics:"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📁 Total files: $(find _site -type f | wc -l)"
        echo "📄 HTML files: $(find _site -name "*.html" | wc -l)"
        echo "🎨 CSS files: $(find _site -name "*.css" | wc -l)"
        echo "📝 Markdown files: $(find _site -name "*.md" | wc -l)"
        echo "📊 JSON files: $(find _site -name "*.json" | wc -l)"
        echo "📏 Total size: $(du -sh _site | cut -f1)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        # Critical files check
        critical_files=("_site/index.html" "_site/CNAME" "_site/.nojekyll")
        for file in "${critical_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file"
          else
            echo "❌ $file MISSING!"
            exit 1
          fi
        done
        
        echo "🎉 Build completed successfully!"

    - name: 📦 Setup Pages
      uses: actions/configure-pages@v4

    - name: 📋 Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4