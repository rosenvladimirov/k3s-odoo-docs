name: 📚 Deploy K3s-Odoo Documentation

on:
  push:
    branches: [ main ]
    paths: [ '**.md', 'assets/**', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: 📁 Checkout
      uses: actions/checkout@v4

    - name: 📝 Setup Static Files
      run: |
        # Създай основна структура
        mkdir -p _site
        
        # Копирай всички markdown файлове
        cp -r . _site/
        
        # Създай CNAME за custom domain
        echo "docs.odoo-shell.dev" > _site/CNAME
        
        # Деактивирай Jekyll
        touch _site/.nojekyll
        
        # Създай robots.txt
        cat > _site/robots.txt << EOF
        User-agent: *
        Allow: /
        Sitemap: https://docs.odoo-shell.dev/sitemap.xml
        EOF

    - name: 📦 Setup Pages
      uses: actions/configure-pages@v4

    - name: 📋 Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4